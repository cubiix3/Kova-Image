[workspace]
members = [".", "crates/thumbnail"]

[package]
name = "kova-image"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
authors = ["Kova Contributors"]
license = "MIT OR Apache-2.0"
description = "A fast, lightweight and secure image viewer for Windows."
repository = "https://github.com/cubiix3/Kova-Image"

[dependencies]
raw-window-handle = "0.6"
kamadak-exif = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "hdr", "exr", "ff"] }
moxcms = { version = "0.8", features = ["in_place"] }
slint = { version = "~1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
resvg = "0.47"
flate2 = "1.1"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Security"] }

[build-dependencies]
slint-build = "~1.17.1"
winresource = "0.1.31"

[dev-dependencies]
png = "0.18"
gif = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "kova-image"
path = "src/main.rs"

[[bin]]
name = "kova-bench"
path = "src/bin/bench.rs"

# rav1d with C-unwind entry points; see scripts/vendor-rav1d.py and docs/DEPENDENCIES.md.
[patch.crates-io]
rav1d = { path = "vendor/rav1d" }
