[package]
name = "kova-thumbnails"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Kova Contributors"]
license = "MIT OR Apache-2.0"
description = "Explorer thumbnail provider for Kova Image."
repository = "https://github.com/cubiix3/Kova-Image"
publish = false

[lib]
name = "kova_thumbnails"
crate-type = ["cdylib", "rlib"]

[dependencies]
kova-image = { path = "../.." }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp"] }
