name: Bug report
description: Report a reproducible problem in Kova Image.
body:
  - type: markdown
    attributes:
      value: "For sensitive security problems, use private reporting from SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version / commit and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Include the image format/dimensions or video container/codec, renderer and reproduction steps when relevant. Do not attach personal or sensitive files.
    validations:
      required: true
