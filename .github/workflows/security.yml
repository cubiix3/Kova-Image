name: Dependency audit
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, .github/workflows/security.yml]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: true
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
